name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            monsterCompendium/packages.lock.json
            monsterCompendium.Tests/packages.lock.json

      - name: Restore workloads
        run: dotnet workload restore

      - name: Restore
        run: dotnet restore

      - name: Build proyecto principal
        run: dotnet build monsterCompendium/monsterCompendium.csproj --no-restore --configuration ${{ matrix.configuration }}

      - name: Build proyecto de tests
        run: dotnet build monsterCompendium.Tests/monsterCompendium.Tests.csproj --no-restore --configuration ${{ matrix.configuration }}

      - name: Test
        run: dotnet test monsterCompendium.Tests/monsterCompendium.Tests.csproj --no-build --verbosity normal --configuration ${{ matrix.configuration }}