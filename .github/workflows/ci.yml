name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar workload de MAUI
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore
        run: dotnet restore

      - name: Build proyecto principal
        run: dotnet build monsterCompendium/monsterCompendium.csproj --no-restore --configuration Release

      - name: Build proyecto de tests
        run: dotnet build monsterCompendium.Tests/monsterCompendium.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test monsterCompendium.Tests/monsterCompendium.Tests.csproj --no-build --verbosity normal --configuration Release